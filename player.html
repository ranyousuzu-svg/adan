<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琉球音階BGM 試聴</title>
<style>
  body {
    margin: 0;
    font-family: 'Helvetica Neue', sans-serif;
    background: linear-gradient(160deg, #0a3d4a 0%, #1a6b5a 50%, #2d6a4f 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    color: #fff;
  }
  h1 { font-size: 1.2rem; letter-spacing: 0.12em; opacity: 0.9; margin-bottom: 4px; }
  .sub { font-size: 0.8rem; opacity: 0.55; margin-bottom: 40px; letter-spacing: 0.06em; }

  .track {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 16px;
    width: 100%;
    max-width: 520px;
    backdrop-filter: blur(6px);
  }
  .track-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .track-num { font-size: 0.7rem; opacity: 0.5; letter-spacing: 0.1em; }
  .bpm { font-size: 0.72rem; background: rgba(255,255,255,0.12); border-radius: 20px; padding: 2px 10px; }
  .track-title { font-size: 1rem; font-weight: bold; margin-bottom: 2px; }
  .track-desc { font-size: 0.78rem; opacity: 0.6; margin-bottom: 14px; }

  audio {
    width: 100%;
    height: 36px;
    border-radius: 8px;
    accent-color: #52b788;
  }
  audio::-webkit-media-controls-panel { background: rgba(255,255,255,0.1); }

  .note {
    font-size: 0.72rem;
    opacity: 0.45;
    margin-top: 40px;
    text-align: center;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<h1>琉球音階 BGM</h1>
<div class="sub">ド・ミ・ファ・ソ・シ（レ・ラ抜き）｜インスタリール用</div>

<div class="track">
  <div class="track-header">
    <span class="track-num">TRACK 01</span>
    <span class="bpm">52 BPM</span>
  </div>
  <div class="track-title">波打ち際の朝</div>
  <div class="track-desc">透明感のある単音メロディ｜オープニング・波が寄せるシーンに</div>
  <audio controls src="track1_naminoasa.wav"></audio>
</div>

<div class="track">
  <div class="track-header">
    <span class="track-num">TRACK 02</span>
    <span class="bpm">60 BPM</span>
  </div>
  <div class="track-title">アダンの森の風</div>
  <div class="track-desc">アルペジオ・木漏れ日感｜アダン林・葉が揺れるカットに</div>
  <audio controls src="track2_mori_no_kaze.wav"></audio>
</div>

<div class="track">
  <div class="track-header">
    <span class="track-num">TRACK 03</span>
    <span class="bpm">68 BPM</span>
  </div>
  <div class="track-title">父の収穫</div>
  <div class="track-desc">力強さと温かみ｜刈り取り作業・手仕事の力強いシーンに</div>
  <audio controls src="track3_chichi_no_shukaku.wav"></audio>
</div>

<div class="track">
  <div class="track-header">
    <span class="track-num">TRACK 04</span>
    <span class="bpm">50 BPM</span>
  </div>
  <div class="track-title">アダンピアス</div>
  <div class="track-desc">最もゆったり・瞑想的｜商品クローズアップ・静けさのシーンに</div>
  <audio controls src="track4_adan_pierce.wav"></audio>
</div>

<div class="note">琉球音階（レとラを抜いた5音階）｜各曲 約62秒</div>

</body>
</html>
